name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build du WAR
        run: mvn -B -f middleware/pom.xml -DskipTests package
      - name: Déploiement (à compléter avec WildFly)
        run: ./scripts/deploy.sh ${{ inputs.environment }}