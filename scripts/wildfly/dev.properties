# Propriétés jboss-cli de l'environnement de développement (domaine medimage.localhost).
# Utilisées par : default-host.cli, add-host.cli, add-api.cli, tls.cli, limits.cli, api-properties.cli.
# Aucun secret ici : le mot de passe du magasin TLS est généré par install-wildfly.sh et passé dans un fichier temporaire.

# --- Site PWA (www) : hôte par défaut (default-host.cli) ---
default.path=/opt/medimage/sites/www
default.aliases=www.medimage.localhost
default.domains=medimage.localhost

# --- Administration (admin) : add-host.cli ---
host.key=admin
host.path=/opt/medimage/sites/admin
host.aliases=admin.medimage.localhost
host.domains=medimage.localhost

# --- API « api » (api-1.0.war) : add-api.cli, première application ---
api.name=api
api.version=1.0
api.aliases=api.medimage.localhost
api.context=medimage
api.domains=medimage.localhost

# --- API « iam » (iam-1.0.war) : add-api.cli, seconde application ---
# install-wildfly.sh recopie ces valeurs sur api.* (fichier temporaire) avant de rejouer add-api.cli.
iam.api.name=iam
iam.api.version=1.0
iam.api.aliases=iam.medimage.localhost
iam.api.context=medimage
iam.api.domains=medimage.localhost

# --- Propriétés système d'api (vérification des jetons, prompt 12) : api-properties.cli ---
medimage.iam.jwks-url=https://iam.medimage.localhost/.well-known/jwks.json
medimage.iam.issuer=https://iam.medimage.localhost
medimage.token.audience=medimage-api

# --- TLS (tls.cli) : certificat autosigné *.medimage.localhost généré par install-wildfly.sh ---
tls.keystore.path=/opt/medimage/tls/medimage.p12

# --- Cloisonnement (limits.cli), valeurs du dossier v2.6 ---
# 81 Mio : un fichier de 80 Mio passe, un fichier de 81 Mio est rejeté (§6.2, SEC-F02).
limits.max-post-size=84934656
# 120 s : délai d'upload (§6.2, SEC-F04).
limits.read-timeout=120000
# Pool de traitements d'image : 4 fils, file de 20 (§7.3, SEC08), délai de traitement de 30 s (SEC-F04).
limits.imaging.threads=4
limits.imaging.queue=20
limits.imaging.hung-task-threshold=30000
