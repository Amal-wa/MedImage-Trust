# Propriétés jboss-cli de l'environnement de production.
# @MIT_DOMAIN@ est remplacé par la variable MIT_DOMAIN (nom deSEC en *.dedyn.io) par install-wildfly.sh et deploy.sh,
# dans un fichier temporaire : le domaine réel n'est jamais écrit dans le dépôt.
# Enregistrements DNS chez deSEC : www, api, iam et admin vers l'adresse du serveur ; CAA (voir scripts/README.md).
# Aucun secret ici.

# --- Site PWA (www) : hôte par défaut (default-host.cli) ---
default.path=/opt/medimage/sites/www
default.aliases=www.@MIT_DOMAIN@
default.domains=@MIT_DOMAIN@

# --- Administration (admin) : add-host.cli ---
host.key=admin
host.path=/opt/medimage/sites/admin
host.aliases=admin.@MIT_DOMAIN@
host.domains=@MIT_DOMAIN@

# --- API « api » (api-1.0.war) : add-api.cli, première application ---
api.name=api
api.version=1.0
api.aliases=api.@MIT_DOMAIN@
api.context=medimage
api.domains=@MIT_DOMAIN@

# --- API « iam » (iam-1.0.war) : add-api.cli, seconde application ---
iam.api.name=iam
iam.api.version=1.0
iam.api.aliases=iam.@MIT_DOMAIN@
iam.api.context=medimage
iam.api.domains=@MIT_DOMAIN@

# --- Propriétés système d'api (vérification des jetons, prompt 12) : api-properties.cli ---
medimage.iam.jwks-url=https://iam.@MIT_DOMAIN@/.well-known/jwks.json
medimage.iam.issuer=https://iam.@MIT_DOMAIN@
medimage.token.audience=medimage-api

# --- TLS (tls.cli) : certificat Let's Encrypt *.@MIT_DOMAIN@ (--must-staple), converti en PKCS#12 ---
tls.keystore.path=/opt/medimage/tls/medimage.p12

# --- Cloisonnement (limits.cli), valeurs du dossier v2.6 ---
limits.max-post-size=84934656
limits.read-timeout=120000
limits.imaging.threads=4
limits.imaging.queue=20
limits.imaging.hung-task-threshold=30000
